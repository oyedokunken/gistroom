version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      typescript-eslint:
        patterns: ["typescript-eslint", "@typescript-eslint/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
