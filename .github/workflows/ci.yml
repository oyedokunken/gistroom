name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      SKIP_ENV_VALIDATION: "true"
      # Placeholders so Prisma can generate the client. Tests that need a real database
      # read DATABASE_URL from repository secrets once integration tests exist (Phase 1).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_SCHEMA: gistroom_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

      # Fails on unreviewed high advisories. Reviewed exceptions live in scripts/audit.mjs (D21).
      - name: Audit dependencies
        run: npm run audit
